<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flower Hub To-Do</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --primary: #ff6b8b;       /* Floral rose pink */
      --primary-light: #ffe6eb; /* Soft pink for backgrounds */
      --bg: #fff0f3;            /* Page background */
      --card-bg: #ffffff;
      --text-main: #2b2b2b;
      --text-muted: #8c8c8c;
      --radius: 30px;           /* Large mobile rounded corners */
      --shadow: 0 10px 30px rgba(255, 107, 139, 0.15);
    }

    body {
      background-color: var(--bg);
      background-image: linear-gradient(135deg, #fff0f3 0%, #ffe6eb 100%);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Mobile-sized app container */
    .app-container {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 400px;
      min-height: 750px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Top floral banner style (used in list view) */
    .header-theme {
      background-color: var(--primary);
      color: white;
      padding: 40px 24px 30px;
      border-radius: 0 0 30px 30px;
    }

    /* Minimal white header (used in form views) */
    .header-white {
      background-color: var(--card-bg);
      color: var(--text-main);
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
    }

    .app-body {
      padding: 24px;
      flex: 1;
      overflow-y: auto;
    }

    /* Buttons */
    .btn-add-new {
      background-color: white;
      color: var(--primary);
      border: none;
      border-radius: 12px;
      padding: 6px 16px;
      font-weight: 600;
      font-size: 0.85rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .btn-primary-custom {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 600;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn-primary-custom:hover { opacity: 0.9; color: white; }

    /* Forms */
    .form-control {
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: none;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 0.25rem rgba(255, 107, 139, 0.25);
    }
    
    a { text-decoration: none; }
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>

  <div class="app-container">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
