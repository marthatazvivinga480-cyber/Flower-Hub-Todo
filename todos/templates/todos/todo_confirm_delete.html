{% extends 'todos/base.html' %}

{% block content %}
<div class="header-white">
  <a href="{% url 'todo_list' %}" style="color: var(--text-main); font-size: 1.2rem;">
    <i class="bi bi-arrow-left"></i>
  </a>
  <span>Delete Task</span>
  <div></div>
</div>

<div class="app-body d-flex flex-column align-items-center justify-content-center text-center">
  <div class="mb-4">
    <i class="bi bi-trash" style="font-size: 4rem; color: #ff4757;"></i>
  </div>
  
  <h3 style="font-weight: 700; color: var(--text-main);">Are you sure?</h3>
  <p class="text-muted mb-5">This task will be permanently removed from your Flower Hub. This action cannot be undone.</p>

  <form method="post" class="w-100 mt-auto">
    {% csrf_token %}
    <button type="submit" class="btn-primary-custom" style="background-color: #ff4757; margin-bottom: 12px;">
      Yes, Delete
    </button>
    <a href="{% url 'todo_list' %}" class="btn-primary-custom d-block text-center" style="background-color: #f5f5f5; color: var(--text-main);">
      Cancel
    </a>
  </form>
</div>
{% endblock %}
